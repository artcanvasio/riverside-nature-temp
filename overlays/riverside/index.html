<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<title>Riverside Nature</title>
<!-- Riverside Nature, as shown inside the Watermarks XR app (the Explore screen loads this page in a frame).
     The painted scene is its own; everything around it is drawn in the app's style: black, soft panels without outlines, one brand
     colour, DM Sans. The round buttons are the same as the ones under the other landmarks (.cbtn in app.css), the icons come from icons.js.
     With "?embed" in the address the title is left to the app. The script lives in riverside.js. -->
<style>
@font-face { font-family: "DM Sans"; src: url(../../fonts/dm-sans.woff2) format("woff2"); font-weight: 100 1000; font-style: normal; font-display: swap; }
:root {
  color-scheme: dark;
  --brand: #51eccf; --steel: #8fa6bc; --disc: rgba(255, 255, 255, 0.1); --ease: cubic-bezier(0.2, 0.75, 0.2, 1);
  --panel: linear-gradient(180deg, #131b21 0, #06080a 88px, #040506 100%); /* a panel as in the app: lit softly from the top, no outline */
  --ctlb: max(34px, calc(var(--sab, env(safe-area-inset-bottom, 0px)) + 14px)); /* how far the buttons sit above the bottom edge, as in the app */
}
* { box-sizing: border-box; }
[hidden] { display: none !important; }
html, body { height: 100%; overflow: hidden; overscroll-behavior: none; }
button { touch-action: manipulation; font: inherit; color: inherit; background: none; border: 0; padding: 0; cursor: pointer; }
body { margin: 0; overflow: hidden; background: #000; color: #fff; font: 300 15px/1.45 "DM Sans", system-ui, -apple-system, "Segoe UI", sans-serif; -webkit-tap-highlight-color: transparent; }
#stage { position: fixed; inset: 0; }
#stage canvas { display: block; width: 100%; height: 100%; touch-action: none; }
/* zoomed in, the window is wider than the screen: the title and the buttons then keep a dark ground. Over the black wall this is invisible. */
#stage::after {
  content: ""; position: absolute; inset: 0; pointer-events: none;
  background:
    linear-gradient(to bottom, rgba(0, 0, 0, 0.72), rgba(0, 0, 0, 0) calc(var(--sat, env(safe-area-inset-top, 0px)) + 104px)),
    linear-gradient(to top, rgba(0, 0, 0, 0.86) calc(var(--ctlb) + 34px), rgba(0, 0, 0, 0) calc(var(--ctlb) + 118px));
}

.title { position: fixed; z-index: 3; pointer-events: none; top: calc(18px + var(--sat, env(safe-area-inset-top, 0px))); left: 0; right: 0; text-align: center; }
.title h1 { margin: 0; font-size: 11px; font-weight: 500; letter-spacing: 0.22em; text-transform: uppercase; color: #fff; }
.title p { margin: 6px 0 0; font-size: 12px; color: var(--steel); }
.embed .title { display: none; }

/* the round buttons under the window: sound, zoom out, zoom in, reset */
.ctl { position: fixed; z-index: 4; left: 0; right: 0; bottom: var(--ctlb); min-height: 82px; display: flex; justify-content: center; align-items: flex-start; gap: 4px; pointer-events: none; }
.cbtn { pointer-events: auto; width: 78px; display: grid; justify-items: center; gap: 8px; padding-top: 11px; font-size: 11px; font-weight: 400; color: #fff; }
.cbtn .disc { width: 48px; height: 48px; border-radius: 50%; display: grid; place-items: center; color: #fff; background: var(--disc); transition: background 0.2s, color 0.2s, transform 0.15s; }
.cbtn:active .disc { transform: scale(0.93); }
.cbtn[aria-pressed="true"] .disc { background: var(--brand); color: #000; }
.cbtn:disabled { opacity: 0.35; cursor: default; }
.cbtn:focus-visible .disc { outline: 2px solid var(--brand); outline-offset: 3px; }
.cbtn em { font-style: normal; white-space: nowrap; }
@media (max-width: 359px) { .cbtn { width: 70px; } }

/* a spot to tap on an animal, a plant or a building */
.hotspot { position: fixed; z-index: 2; width: 36px; height: 36px; margin: -18px 0 0 -18px; border-radius: 50%; }
.hotspot::before { content: ""; position: absolute; inset: 12px; border-radius: 50%; background: var(--brand); box-shadow: 0 0 0 1.5px rgba(0, 0, 0, 0.55); }
.hotspot::after { content: ""; position: absolute; inset: 3px; border-radius: 50%; border: 1px solid var(--brand); animation: ping 2.6s ease-out infinite; }
.hotspot:focus-visible { outline: 2px solid #fff; outline-offset: 2px; }
@keyframes ping { 0% { transform: scale(0.45); opacity: 1; } 75%, 100% { transform: scale(1.1); opacity: 0; } }

/* what the spot tells: a panel that floats over the window */
.card {
  position: fixed; z-index: 5; width: min(320px, calc(100vw - 32px)); padding: 24px; border-radius: 4px; background: var(--panel);
  opacity: 0; transform: translateY(6px); transition: opacity 0.25s, transform 0.25s; pointer-events: none;
}
.card.show { opacity: 1; transform: none; pointer-events: auto; }
.card .tag { margin: 0 44px 0 0; font-size: 10px; font-weight: 500; letter-spacing: 0.16em; line-height: 20px; text-transform: uppercase; color: var(--brand); }
.card h2 { margin: 10px 0 0; font-size: 24px; font-weight: 200; line-height: 30px; letter-spacing: 0.02em; }
.card .sci { margin: 10px 0 0; font-size: 13px; line-height: 17px; color: var(--steel); }
.card p.body { margin: 10px 0 0; font-size: 14px; line-height: 22px; color: rgba(255, 255, 255, 0.88); }
.card .close { position: absolute; top: 12px; right: 12px; width: 44px; height: 44px; border-radius: 50%; display: grid; place-items: center; color: var(--steel); }

.loader { position: fixed; inset: 0; z-index: 9; display: grid; place-content: center; justify-items: center; gap: 18px; background: #000; color: var(--steel); font-size: 14px; transition: opacity 0.6s; }
.loader.done { opacity: 0; pointer-events: none; }
.loader svg { animation: spin 1.1s linear infinite; }
.loader circle { fill: none; stroke: rgba(255, 255, 255, 0.16); stroke-width: 1.5; }
.loader circle + circle { stroke: var(--brand); stroke-width: 2; stroke-linecap: round; stroke-dasharray: 44 132; }
.loader p { margin: 0; }
@keyframes spin { to { transform: rotate(360deg); } }

/* a short line of help, above the buttons */
.toast { position: fixed; z-index: 6; left: 50%; transform: translateX(-50%); bottom: calc(var(--ctlb) + 100px); width: max-content; max-width: calc(100vw - 32px); padding: 9px 18px; border-radius: 20px; background: #1b2026; font-size: 13px; font-weight: 400; line-height: 17px; text-align: center; }
/* the quiet one: plain words in the gap between the window and the buttons (the script keeps that gap free) */
.toast.plain { padding: 0; background: none; color: rgba(255, 255, 255, 0.8); text-shadow: 0 1px 8px rgba(0, 0, 0, 0.6); bottom: calc(var(--ctlb) + 88px); }

/* shown while the sound is on: a small link on the line above the buttons, and the list it opens above that.
   (That line is also where a hint or a message appears; the link steps aside meanwhile.) */
.credits { position: fixed; z-index: 4; left: 0; right: 0; bottom: calc(var(--ctlb) + 89px); text-align: center; pointer-events: none; }
.credits.wait { visibility: hidden; }
.credits > button { pointer-events: auto; padding: 6px 10px; font-size: 11px; color: var(--steel); text-decoration: underline; text-underline-offset: 3px; }
.credits-pop { pointer-events: auto; position: absolute; left: 50%; transform: translateX(-50%); bottom: calc(100% + 6px); width: min(300px, calc(100vw - 32px)); padding: 18px; border-radius: 4px; background: var(--panel); font-size: 12px; line-height: 18px; text-align: left; color: rgba(255, 255, 255, 0.88); }
.credits-pop p { margin: 0 0 8px; } .credits-pop p:last-child { margin: 0; }
.credits-pop b { font-weight: 500; }
.credits-pop a { color: var(--brand); }

@media (max-width: 640px) {
  .card { left: 16px !important; right: 16px; width: auto; top: auto !important; bottom: calc(var(--ctlb) + 96px); }
}
/* a phone held sideways: the window takes the full height, the buttons stand in a column at the right, words keep to the left */
@media (orientation: landscape) and (max-height: 520px) {
  .ctl { left: auto; right: max(10px, env(safe-area-inset-right, 0px)); top: 56px; bottom: 8px; flex-direction: column; justify-content: center; align-items: center; min-height: 0; gap: 0; }
  .cbtn { padding-top: 6px; }
  .cbtn em { display: none; }
  #stage::after { background: linear-gradient(to left, rgba(0, 0, 0, 0.8) 30px, rgba(0, 0, 0, 0) 120px), linear-gradient(to bottom, rgba(0, 0, 0, 0.6), rgba(0, 0, 0, 0) 76px); }
  .title { left: max(20px, env(safe-area-inset-left, 0px)); right: auto; text-align: left; }
  .toast { bottom: 16px; }
  .toast.plain { left: max(20px, env(safe-area-inset-left, 0px)); bottom: 18px; transform: none; max-width: 24vw; text-align: left; }
  .credits { display: none; }
  .card { left: 16px !important; right: auto; width: min(340px, 46vw); top: 56px !important; bottom: auto; max-height: calc(100vh - 72px); overflow-y: auto; }
}
@media (prefers-reduced-motion: reduce) { .hotspot::after { animation: none; opacity: 0.7; transform: scale(0.9); } }
</style>

<div id="stage"></div>
<div class="title" id="title"><h1>Riverside Nature</h1><p>A window onto the Lech · Augsburg</p></div>
<div id="hotspots"></div>
<div class="card" id="card" role="dialog" aria-live="polite" aria-labelledby="cardTitle">
  <button class="close" id="cardClose" aria-label="Close"></button>
  <p class="tag" id="cardTag">Wildlife</p>
  <h2 id="cardTitle"></h2>
  <p class="sci" id="cardSci"></p>
  <p class="body" id="cardBody"></p>
</div>
<div class="ctl" id="bar">
  <button class="cbtn" id="soundBtn" aria-pressed="false" title="Birdsong and river sounds"><span class="disc"></span><em>Sound</em></button>
  <button class="cbtn" id="zoomOutBtn" aria-label="Zoom out: step back from the window"><span class="disc"></span><em>Zoom out</em></button>
  <button class="cbtn" id="zoomInBtn" aria-label="Zoom in: step closer to the window"><span class="disc"></span><em>Zoom in</em></button>
  <button class="cbtn" id="resetBtn" aria-label="Reset the view"><span class="disc"></span><em>Reset</em></button>
  <button class="cbtn" id="xrBtn" hidden><span class="disc"></span><em id="xrLbl">Headset</em></button>
</div>
<div class="credits" id="credits" hidden>
  <button id="creditsBtn" aria-expanded="false" aria-controls="creditsPop">Sound credits</button>
  <div class="credits-pop" id="creditsPop" hidden>
    <p><b>Blackbird song</b> — Oona Räisänen, public domain · <a href="https://commons.wikimedia.org/wiki/File:Turdus_merula_2.ogg" target="_blank" rel="noopener">Wikimedia Commons</a></p>
    <p><b>River</b> — RandomMind, CC0 · <a href="https://opengameart.org/content/sea-and-river-wave-sounds" target="_blank" rel="noopener">OpenGameArt</a></p>
    <p><b>Weir water</b> — kurt, <a href="https://creativecommons.org/licenses/by/3.0/" target="_blank" rel="noopener">CC BY 3.0</a> · <a href="https://opengameart.org/content/stream-sounds" target="_blank" rel="noopener">OpenGameArt</a></p>
    <p><b>Wind</b> — generated in the browser</p>
  </div>
</div>
<div class="loader" id="loader"><svg width="64" height="64" viewBox="0 0 64 64" aria-hidden="true"><circle cx="32" cy="32" r="28"/><circle cx="32" cy="32" r="28"/></svg><p>Loading Riverside Nature</p></div>
<div class="toast" id="toast" role="status" hidden></div>

<script type="module" src="riverside.js"></script>
