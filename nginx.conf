# Watermarks XR · Digital overlays — static site. nginx includes this file inside its http { } block.

# Code is re-checked on every visit (a short "not modified" when nothing changed); models, pictures, sounds and fonts are kept a week.
map $uri $ov_cache {
  default                                         "no-cache";
  ~^/(vendor|fonts|models|assets)/                "public, max-age=604800";
  ~\.(webp|png|jpe?g|svg|ico|mp3|woff2|glb)$      "public, max-age=604800";
}
# Content Security Policy: everything comes from this site. 'wasm-unsafe-eval' lets the 3D model decoder (WebAssembly) run;
# Safari before version 16 needs 'unsafe-eval' for the same thing.
map $http_user_agent $ov_script {
  default                                "script-src 'self' 'wasm-unsafe-eval'";
  "~(iPhone|iPad|iPod).+ OS 1[0-5]_"     "script-src 'self' 'unsafe-eval' blob:";
  "~Version/1[0-5]\..+Safari"            "script-src 'self' 'unsafe-eval' blob:";
}
map $uri $ov_csp {
  default    "default-src 'self'; $ov_script; style-src 'self' 'unsafe-inline'; img-src 'self' blob: data:; media-src 'self' blob: data:; connect-src 'self' blob: data:; worker-src 'self' blob:; font-src 'self'; frame-src 'self'; frame-ancestors 'self' https://artcanvas.io https://*.artcanvas.io; object-src 'none'; base-uri 'self'; form-action 'none'";
}

server {
  listen 80;
  server_name _;
  root /usr/share/nginx/html;
  index index.html;
  server_tokens off;
  charset utf-8;
  charset_types text/css text/javascript application/json application/manifest+json image/svg+xml text/plain;

  types {
    text/html html; text/css css; text/javascript js mjs; application/json json; text/plain txt;
    model/gltf-binary glb; image/png png; image/jpeg jpg jpeg; image/svg+xml svg; image/webp webp; image/x-icon ico;
    audio/mpeg mp3; font/woff2 woff2;
  }

  gzip_static on;
  gzip on;
  gzip_vary on;
  gzip_min_length 1024;
  gzip_types text/css text/javascript application/json image/svg+xml text/plain model/gltf-binary;

  add_header Cache-Control $ov_cache;
  add_header Content-Security-Policy $ov_csp always;
  add_header X-Content-Type-Options "nosniff" always;
  add_header Referrer-Policy "strict-origin-when-cross-origin" always;
  add_header Cross-Origin-Opener-Policy "same-origin" always;
  add_header Cross-Origin-Resource-Policy "same-site" always;
  add_header Strict-Transport-Security "max-age=31536000" always;
  # motion sensors for looking around; no camera, location or microphone on this site
  add_header Permissions-Policy "camera=(), geolocation=(), microphone=(), accelerometer=(self), gyroscope=(self), magnetometer=(self), fullscreen=(self), autoplay=(self), payment=(), usb=(), serial=(), display-capture=(), hid=(), midi=()" always;

  if ($request_method !~ ^(GET|HEAD)$) { return 405; }
  location ~ /\. { return 404; }
  location ~ \.[a-zA-Z0-9]+$ { try_files $uri =404; }
  location / { try_files $uri $uri/ /index.html; }
}
